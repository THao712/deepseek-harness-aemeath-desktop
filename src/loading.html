<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness Aemeath</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei UI", "Segoe UI Variable", "Segoe UI", sans-serif;
        background: #120c18;
        color: #fff4f8;
        --eye-core: #f6b347;
        --eye-pupil: #f07830;
        --eye-highlight: #fff0bd;
        --hair-root: #2f1027;
        --hair-mid: #8d4d6c;
        --hair-rose: #d77fa7;
        --hair-neon: #ff8fc8;
        --hair-highlight: #ffd2e4;
        --crystal-cyan: #8bdcf3;
        --crystal-blue: #4da8d8;
        --crystal-bright: #bdf5ff;
        --eye-flare: #ffd36f;
        --surface: #211427;
        --text-secondary: #ddc4d2;
        --text-muted: #9d8293;
        --hair-ease: cubic-bezier(0.22, 0.72, 0.24, 1);
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        position: relative;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 84% 58%, rgb(139 220 243 / 14%), transparent 30%),
          radial-gradient(circle at 72% 24%, rgb(255 143 200 / 12%), transparent 26%),
          #120c18;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(90deg, rgb(18 12 24 / 98%) 0%, rgb(18 12 24 / 84%) 42%, rgb(18 12 24 / 28%) 100%),
          radial-gradient(circle at 76% 48%, transparent 0 25%, rgb(139 220 243 / 10%) 46%, transparent 68%),
          url("../assets/aemeath-eye-backdrop.webp");
        background-position: center, center, center right;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-size: cover, cover, cover;
        filter: saturate(1.12) contrast(1.04);
      }

      body::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle, rgb(189 245 255 / 74%) 0 1px, transparent 1.8px),
          radial-gradient(circle, rgb(255 143 200 / 66%) 0 1px, transparent 1.8px),
          radial-gradient(circle, rgb(255 211 111 / 68%) 0 1px, transparent 1.7px),
          repeating-radial-gradient(circle at 78% 48%, transparent 0 76px, rgb(139 220 243 / 7%) 77px, transparent 79px 142px),
          linear-gradient(116deg, transparent 0 45%, rgb(255 210 228 / 12%) 45.15% 45.38%, transparent 45.62%),
          linear-gradient(123deg, transparent 0 68%, rgb(139 220 243 / 10%) 68.15% 68.38%, transparent 68.62%);
        background-position: 0 0, 40px 26px, 88px 58px, center, center, center;
        background-size: 137px 119px, 173px 151px, 211px 191px, 100% 100%, 100% 100%, 100% 100%;
        mix-blend-mode: screen;
        animation: constellation-drift 24s linear infinite;
      }

      .ambient {
        position: absolute;
        z-index: 1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .ambient::before,
      .ambient::after {
        content: "";
        position: absolute;
        border: 1px solid rgb(189 245 255 / 18%);
        border-radius: 50%;
        box-shadow:
          0 0 38px rgb(139 220 243 / 9%),
          inset 0 0 42px rgb(255 143 200 / 7%);
        animation: aura-orbit 9s var(--hair-ease) infinite;
      }

      .ambient::before {
        right: -16vw;
        top: -30vh;
        width: min(72vw, 920px);
        aspect-ratio: 1;
      }

      .ambient::after {
        right: 8vw;
        bottom: -44vh;
        width: min(52vw, 680px);
        aspect-ratio: 1;
        border-color: rgb(255 143 200 / 15%);
        animation-delay: -4.5s;
      }

      .wing {
        position: absolute;
        right: clamp(18px, 4vw, 72px);
        width: clamp(150px, 20vw, 330px);
        height: clamp(28px, 4vw, 64px);
        clip-path: polygon(0 48%, 82% 0, 100% 48%, 76% 100%);
        background:
          linear-gradient(90deg, transparent, rgb(255 143 200 / 28%) 42%, rgb(189 245 255 / 52%) 76%, transparent),
          linear-gradient(180deg, rgb(255 255 255 / 15%), transparent 58%);
        filter: drop-shadow(0 0 14px rgb(139 220 243 / 26%));
        transform-origin: right center;
        animation: wing-breathe 4.8s var(--hair-ease) infinite;
      }

      .wing-one {
        top: 15%;
        transform: rotate(-19deg);
      }

      .wing-two {
        top: 28%;
        right: -24px;
        opacity: 0.72;
        transform: rotate(-7deg) scale(0.78);
        animation-delay: -1.6s;
      }

      .wing-three {
        bottom: 13%;
        opacity: 0.62;
        transform: rotate(18deg) scale(0.9);
        animation-delay: -3.1s;
      }

      main {
        position: relative;
        z-index: 2;
        width: min(600px, calc(100vw - 80px));
        min-height: 100vh;
        margin-left: 9vw;
        display: grid;
        align-content: center;
        gap: 30px;
      }

      main::before {
        content: "";
        position: absolute;
        top: calc(50% - 150px);
        left: -28px;
        width: 2px;
        height: 300px;
        background: linear-gradient(
          transparent,
          var(--hair-neon) 24%,
          var(--crystal-bright) 52%,
          var(--eye-flare) 76%,
          transparent
        );
        background-size: 100% 220%;
        box-shadow:
          0 0 12px rgb(255 143 200 / 40%),
          0 0 22px rgb(139 220 243 / 26%);
        animation: rail-travel 6s linear infinite;
      }

      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .mark-wrap {
        position: relative;
        width: 76px;
        height: 76px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
      }

      .mark-wrap::before,
      .mark-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgb(189 245 255 / 32%);
        border-radius: 50%;
        box-shadow: 0 0 22px rgb(139 220 243 / 16%);
        animation: mark-orbit 4.6s linear infinite;
      }

      .mark-wrap::after {
        inset: 7px;
        border-color: rgb(255 211 111 / 34%);
        border-style: dashed;
        animation-direction: reverse;
        animation-duration: 6.4s;
      }

      .mark {
        position: relative;
        z-index: 1;
        width: 62px;
        height: 62px;
        border: 1px solid rgb(255 240 189 / 34%);
        border-radius: 10px;
        object-fit: cover;
        box-shadow:
          0 0 0 2px rgb(246 179 71 / 10%),
          0 0 28px rgb(246 179 71 / 28%),
          0 0 44px rgb(255 143 200 / 18%);
        animation: mark-breathe 3.2s var(--hair-ease) infinite;
      }

      h1 {
        margin: 0;
        color: transparent;
        background: linear-gradient(
          100deg,
          var(--hair-highlight),
          var(--eye-highlight) 30%,
          var(--hair-neon) 58%,
          var(--crystal-bright) 82%,
          var(--hair-highlight)
        );
        background-size: 240% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-family: Bahnschrift, "Microsoft YaHei UI", sans-serif;
        font-size: 40px;
        font-weight: 650;
        line-height: 1;
        text-shadow:
          0 0 22px rgb(255 143 200 / 34%),
          0 0 38px rgb(139 220 243 / 18%);
        animation: spectrum-shift 7s var(--hair-ease) infinite;
      }

      .status {
        position: relative;
        display: grid;
        gap: 14px;
        padding-left: 18px;
        border-left: 1px solid rgb(139 220 243 / 24%);
      }

      .status::before {
        content: "";
        position: absolute;
        top: 0;
        left: -1px;
        width: 1px;
        height: 38%;
        background: linear-gradient(var(--eye-flare), var(--hair-neon), transparent);
        box-shadow:
          0 0 10px rgb(255 211 111 / 42%),
          0 0 18px rgb(255 143 200 / 28%);
        animation: status-charge 2.6s var(--hair-ease) infinite;
      }

      .status-line {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 28px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .eye-loader {
        position: relative;
        width: 52px;
        height: 26px;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid rgb(215 127 167 / 52%);
        border-radius: 70% 18% 70% 18% / 70% 28% 70% 28%;
        background: var(--hair-root);
        box-shadow:
          inset 0 -5px 12px rgb(9 4 13 / 62%),
          0 0 18px rgb(215 127 167 / 28%),
          0 0 28px rgb(139 220 243 / 14%);
        transform: rotate(-4deg) scaleY(1);
        animation: eye-blink 1.8s var(--hair-ease) infinite;
      }

      .eye-loader::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 15px;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 28%, var(--eye-highlight) 0 9%, transparent 10%),
          radial-gradient(circle, var(--eye-core) 0 34%, var(--eye-pupil) 58%, #873328 82%);
        box-shadow:
          0 0 0 2px rgb(246 179 71 / 10%),
          0 0 13px rgb(246 179 71 / 52%);
      }

      .eye-loader::after {
        content: "";
        position: absolute;
        top: 9px;
        left: 22px;
        width: 8px;
        height: 8px;
        background: var(--eye-highlight);
        clip-path: polygon(50% 0, 62% 36%, 100% 50%, 62% 64%, 50% 100%, 38% 64%, 0 50%, 38% 36%);
        filter: drop-shadow(0 0 4px var(--eye-highlight));
        animation: pupil-focus 1.8s var(--hair-ease) infinite;
      }

      .progress {
        width: 100%;
        height: 6px;
        overflow: hidden;
        border: 1px solid rgb(189 245 255 / 12%);
        border-radius: 3px 1px 3px 3px;
        background: #25162d;
        box-shadow:
          inset 0 1px 3px rgb(4 2 7 / 62%),
          0 0 18px rgb(139 220 243 / 8%);
      }

      .progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--hair-mid),
          var(--hair-neon) 38%,
          var(--eye-flare) 62%,
          var(--crystal-bright)
        );
        box-shadow:
          0 0 12px rgb(255 143 200 / 42%),
          0 0 20px rgb(139 220 243 / 34%);
        animation: hair-travel 1.35s var(--hair-ease) infinite;
      }

      .detail {
        max-width: 560px;
        margin: 0;
        color: var(--text-muted);
        font: 13px/1.65 "Cascadia Mono", Consolas, monospace;
      }

      .actions {
        display: none;
        gap: 10px;
      }

      button {
        min-height: 38px;
        padding: 0 16px;
        border: 1px solid rgb(215 127 167 / 34%);
        border-radius: 7px 2px 7px 7px;
        color: var(--hair-highlight);
        background: rgb(42 25 49 / 92%);
        font: 600 13px "Microsoft YaHei UI", "Segoe UI Variable", sans-serif;
        cursor: pointer;
        transition:
          border-color 160ms var(--hair-ease),
          box-shadow 220ms var(--hair-ease),
          transform 180ms cubic-bezier(0.2, 0.85, 0.35, 1.22);
      }

      button.primary {
        border-color: rgb(255 240 189 / 30%);
        color: #291419;
        background: var(--eye-core);
        box-shadow: 0 0 18px rgb(246 179 71 / 16%);
      }

      button:hover {
        border-color: var(--crystal-cyan);
        box-shadow: 0 0 22px rgb(139 220 243 / 14%);
      }

      button:active {
        transform: scale(0.97);
      }

      button:focus-visible {
        outline: 2px solid var(--crystal-cyan);
        outline-offset: 2px;
        box-shadow: 0 0 0 4px rgb(139 220 243 / 13%);
      }

      body.error .eye-loader {
        border-color: #f06d86;
        animation: none;
      }

      body.error .eye-loader::before {
        background: radial-gradient(circle, #ffb1c0 0 18%, #f06d86 48%, #76243d 84%);
        box-shadow: 0 0 15px rgb(240 109 134 / 44%);
      }

      body.error .progress {
        display: none;
      }

      body.error .actions {
        display: flex;
      }

      @keyframes eye-blink {
        0%,
        40%,
        56%,
        100% {
          transform: rotate(-4deg) scaleY(1);
        }
        47%,
        50% {
          transform: rotate(-4deg) scaleY(0.08);
        }
      }

      @keyframes pupil-focus {
        0%,
        36%,
        62%,
        100% {
          opacity: 0.76;
          transform: scale(0.78) rotate(0deg);
        }
        45%,
        55% {
          opacity: 1;
          transform: scale(1.18) rotate(45deg);
        }
      }

      @keyframes hair-travel {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(250%);
        }
      }

      @keyframes constellation-drift {
        from {
          background-position: 0 0, 40px 26px, 88px 58px, center, center, center;
        }
        to {
          background-position: 137px -119px, -133px 151px, 211px -96px, center, center, center;
        }
      }

      @keyframes aura-orbit {
        0%,
        100% {
          transform: scale(0.98) rotate(-2deg);
          opacity: 0.62;
        }
        50% {
          transform: scale(1.025) rotate(2deg);
          opacity: 1;
        }
      }

      @keyframes wing-breathe {
        0%,
        100% {
          filter: drop-shadow(0 0 14px rgb(139 220 243 / 24%));
          opacity: 0.48;
        }
        50% {
          filter:
            drop-shadow(0 0 18px rgb(139 220 243 / 42%))
            drop-shadow(0 0 26px rgb(255 143 200 / 18%));
          opacity: 0.86;
        }
      }

      @keyframes rail-travel {
        from {
          background-position: 0 100%;
        }
        to {
          background-position: 0 -120%;
        }
      }

      @keyframes mark-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes mark-breathe {
        0%,
        100% {
          transform: scale(1);
          filter: saturate(1.08);
        }
        50% {
          transform: scale(1.035);
          filter: saturate(1.22) brightness(1.06);
        }
      }

      @keyframes spectrum-shift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      @keyframes status-charge {
        0%,
        100% {
          height: 24%;
          opacity: 0.56;
        }
        50% {
          height: 72%;
          opacity: 1;
        }
      }

      @media (max-width: 760px) {
        main {
          width: calc(100vw - 48px);
          margin: 0 24px;
        }

        h1 {
          font-size: 32px;
        }

        body::before {
          background-image:
            linear-gradient(90deg, rgb(18 12 24 / 98%), rgb(18 12 24 / 78%)),
            url("../assets/aemeath-eye-backdrop.webp");
          background-position: center, 68% center;
          background-size: cover, cover;
        }

        .wing {
          opacity: 0.28;
        }

        .ambient::before,
        .ambient::after {
          opacity: 0.46;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="wing wing-one"></span>
      <span class="wing wing-two"></span>
      <span class="wing wing-three"></span>
    </div>
    <main>
      <div class="brand">
        <span class="mark-wrap" aria-hidden="true">
          <img class="mark" src="../assets/aemeath-app-icon.png" alt="" />
        </span>
        <h1>DeepSeek Harness Aemeath</h1>
      </div>

      <section class="status" aria-live="polite">
        <div class="status-line">
          <span class="eye-loader" aria-hidden="true"></span>
          <span id="status">Starting local workspace</span>
        </div>
        <div class="progress" aria-hidden="true"></div>
        <p class="detail" id="detail">Preparing the desktop session...</p>
        <div class="actions">
          <button class="primary" id="retry" type="button">Retry</button>
          <button id="show-log" type="button">Open log</button>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "starting";
      const detail = params.get("detail") || "Preparing the desktop session...";

      if (mode === "error") {
        document.body.classList.add("error");
        document.querySelector("#status").textContent = "Harness could not start";
      }

      document.querySelector("#detail").textContent = detail;
      document.querySelector("#retry").addEventListener("click", () => {
        window.desktopHarness.retry();
      });
      document.querySelector("#show-log").addEventListener("click", () => {
        window.desktopHarness.showLog();
      });
    </script>
  </body>
</html>
